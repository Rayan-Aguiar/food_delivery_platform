services:
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: auth-swagger-ui
    restart: ${AUTH_RESTART_POLICY:-unless-stopped}
    ports:
      - "8085:8080"
    environment:
      # Seletor no topo da UI para alternar entre os servicos.
      URLS: >-
        [{"url": "/specs/auth/openapi.v1.yaml", "name": "auth-service"},
         {"url": "/specs/restaurant/openapi.v1.yaml", "name": "restaurant-service"}]
    volumes:
      - ../../services/auth-service/docs/openapi:/usr/share/nginx/html/specs/auth:ro
      - ../../services/restaurant-service/docs/openapi:/usr/share/nginx/html/specs/restaurant:ro
