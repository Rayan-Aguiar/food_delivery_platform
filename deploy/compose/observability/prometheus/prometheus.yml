global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8081"]

  # restaurant-service roda em outra stack de compose (rede propria), entao o
  # Prometheus coleta pela porta publicada no host.
  - job_name: restaurant-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8083"]
